name: SubTrack
options:
  bundleIdPrefix: com.hasan
  deploymentTarget:
    iOS: "17.0"
targets:
  SubTrack:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        NSMicrophoneUsageDescription: "Aboneliklerini sesinle hızlıca ekleyebilmek için mikrofon erişimi gerekiyor."
        NSSpeechRecognitionUsageDescription: "Söylediğin abonelik adı, tarih ve tutarı metne çevirmek için konuşma tanıma izni gerekiyor."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hasan.subtrack
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
